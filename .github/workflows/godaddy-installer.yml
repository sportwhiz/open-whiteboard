name: GoDaddy installer
on:
  pull_request:
    paths: ['tools/godaddy-deploy/**', '.github/workflows/godaddy-installer.yml', 'package.json', 'pnpm-lock.yaml', 'apps/web/package.json']
  push:
    branches: [main]
    paths: ['tools/godaddy-deploy/**', '.github/workflows/godaddy-installer.yml', 'package.json', 'pnpm-lock.yaml', 'apps/web/package.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.30.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:godaddy-installer
      - run: pnpm --filter @whiteboard/web exec playwright install --with-deps chromium
      - run: pnpm test:godaddy-installer:browser
      - run: pnpm exec wrangler deploy --dry-run --config tools/godaddy-deploy/wrangler.jsonc
